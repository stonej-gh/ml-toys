<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" width="780" height="495" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Curriculum ladder versus league pool</title>
<desc id="dsc">Two training designs side by side. On the left, the curriculum: the ten
scripted opponents stand in a vertical ladder from L1 at the bottom to L10, the ported robot,
at the top. The agent trains against exactly one rung at a time, here L3, and advances only
by beating the rung it stands on. The rungs above the current one are drawn dashed, because a
climb that stalls, as the v2 run stalled at L3, never meets them at all: on a ladder,
coverage is contingent on climbing. On the right, the league: every episode samples a fresh
opponent from a pool that holds all ten scripted rungs, weighted toward the ones the agent is
currently losing to, at sixty percent, and frozen copies of the agent's own past selves at
forty percent. The same network and the same PPO update are asked to be good against a
distribution rather than against a rung, and the pool of past selves hardens as the agent
improves. Experiment 03 measures what this difference buys.</desc>

<style>
  .bg   { fill: #ffffff; }
  .n    { stroke-width: 1.6; }
  .world{ fill: #f6f8fa; stroke: #c9d1d9; }
  .net  { fill: #e8f1fb; stroke: #8fb4dc; }
  .cur  { fill: #fdf3e7; stroke: #c98a3c; }
  .ghost{ fill: #ffffff; stroke: #c9d1d9; stroke-dasharray: 5 4; }
  .pool { fill: #fbfcfd; stroke: #c9d1d9; }
  text  { font-family: Helvetica Neue; }
  .t    { fill: #16202b; font-size: 21px; font-weight: 600; }
  .bt   { fill: #16202b; font-size: 16px; font-weight: 600; }
  .s    { fill: #5c6773; font-size: 14px; }
  .gs   { fill: #98a1ab; font-size: 14px; }
  .os   { fill: #c98a3c; font-size: 14px; font-weight: 600; }
  .note { fill: #5c6773; font-size: 14px; font-style: italic; }
  .edge { fill: none; stroke: #7b8695; stroke-width: 1.6; }
  .heavy{ stroke-width: 2.8; }
  .dash { stroke-dasharray: 5 4; }
  .rule { stroke: #e3e7eb; stroke-width: 1.2; }
</style>

