<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" width="780" height="540" role="img" aria-labelledby="ttl dsc">
<title id="ttl">The two halves of the lab, and the file that joins them</title>
<desc id="dsc">The repository is two independent halves that meet at one artifact. The pilot half
is reinforcement learning: the orbitduel package holds the physics and the environment, the
agents package holds the DQN, PPO and league trainers, and training produces both tracked
checkpoints v1 through v6 and recorded replay JSON files. The replay JSON is the seam. From
it, the browser player viz/watch.html replays an episode for a human. Also from it, the
spotter half begins: spotter/render.py turns a replay into a frame together with an exact
segmentation mask, since the renderer knows precisely where every object was drawn and so
labels itself. tools/gen_dataset.py builds a seeded synthetic dataset from those frames,
spotter training fits a small convolutional network and exports it, the deploy directory
holds the resulting golden bundle, and demo/app.py serves a live overlay. The connection is
worth noticing: the spotter's loader reads pilot replay JSON exactly as written, with no
conversion step, which is the entire bridge between a policy that decides and perception that
sees.</desc>

